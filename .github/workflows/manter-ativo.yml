name: Manter ativo

# No plano gratuito, o Render "adormece" a API depois de 15 minutos sem uso, e a
# próxima abertura do site espera até 1 minuto em "Verificando sua sessão...".
# Com leitor de tela, essa espera parece que o app travou. A cada 10 minutos,
# esta Action chama /api/health, que também lê o banco: a API fica acordada e o
# Supabase gratuito não pausa o projeto por falta de uso.
#
# Custo: uma API acordada o mês todo usa cerca de 730 das 750 horas gratuitas do
# Render por mês. Elas são da conta inteira: outro Web Service gratuito na mesma
# conta dividiria essas horas (Static Sites não contam).
# O GitHub não garante o horário exato das Actions agendadas (atrasos de alguns
# minutos são normais) e as desliga em repositórios sem commits há 60 dias; se
# isso acontecer, reative na aba Actions.
# Endereço: variável do repositório API_HEALTH_URL (Settings → Secrets and
# variables → Actions → Variables); sem ela, usa o endereço publicado.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: manter-ativo
  cancel-in-progress: false

jobs:
  ping:
    name: Chamar /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar a API (com espera para ela acordar)
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://cardvoz-api.onrender.com/api/health' }}
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 20 --retry-all-errors "$API_HEALTH_URL"
